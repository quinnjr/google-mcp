name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR commits are not worth runner time, but every push to main
  # keeps its own complete build record.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Must precede setup-node: its pnpm cache resolution needs pnpm on PATH.
      # Version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v6

      # 22, not 20: pnpm 11 imports node:sqlite and refuses to start on
      # anything below 22.13. This is the toolchain's floor, not the package's
      # - engines.node stays at >=20.19.0 because that is all the published
      # dist actually needs. The tradeoff is that CI no longer exercises the
      # oldest Node we claim to support.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build

      # Not `pnpm test` — that is bare vitest, which watches and would hang the
      # job. This also enforces the coverage thresholds in vitest.config.ts.
      - run: pnpm test:coverage
